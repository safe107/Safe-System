# Development on your own computer. No paid provider or S3 required.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: safe
      POSTGRES_USER: safe
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Run the local startup script first}
    volumes:
      - local-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safe -d safe"]
      interval: 5s
      timeout: 3s
      retries: 20
  system:
    build:
      context: .
      dockerfile: infra/docker/hosted.Dockerfile
    ports:
      - "127.0.0.1:${SAFE_LOCAL_PORT:-5173}:10000"
    environment:
      PORT: "10000"
      DATABASE_URL: jdbc:postgresql://postgres:5432/safe
      DATABASE_USERNAME: safe
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Missing local administrator}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Missing local password}
      SAFE_PRODUCTION: "false"
      COOKIE_SECURE: "false"
      FRONTEND_URL: http://localhost:${SAFE_LOCAL_PORT:-5173}
      CORS_ALLOWED_ORIGINS: http://localhost:${SAFE_LOCAL_PORT:-5173}
      STORAGE_MODE: local
      STORAGE_ROOT: /data/files
    volumes:
      - local-files:/data/files
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  local-postgres:
  local-files:
