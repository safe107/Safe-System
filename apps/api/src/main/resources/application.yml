spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/safe}
    username: ${DATABASE_USERNAME:safe}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_batch_fetch_size: 100
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
safe:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  production: ${SAFE_PRODUCTION:false}
  storage-mode: ${STORAGE_MODE:local}
  storage-root: ${STORAGE_ROOT:./.local/files}
  storage-endpoint: ${STORAGE_ENDPOINT:}
  storage-bucket: ${STORAGE_BUCKET:}
  storage-region: ${STORAGE_REGION:us-east-1}
  admin-username: ${ADMIN_USERNAME:}
  admin-password: ${ADMIN_PASSWORD:}
  github-token: ${GITHUB_TOKEN:}
