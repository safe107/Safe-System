services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: safe
      POSTGRES_USER: safe
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safe -d safe"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    ports: ["127.0.0.1:8080:8080"]
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/safe
      DATABASE_USERNAME: safe
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      STORAGE_ROOT: /data/files
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    volumes: ["files:/data/files"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
  files:
